{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Roomify Admin</title>

    <link href="https://fonts.googleapis.com/css?family=Lora:400,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cabin:400,500,600,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/modern.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/admin_panel.css' %}" type="text/css">
</head>
<body class="admin-login-body">
    <div class="admin-login-bg"></div>
    <div class="admin-login-wrap">
        <div class="admin-login-card">
            <div class="text-center mb-3">
                <img src="{% static 'img/Logo.png' %}" alt="Roomify" class="admin-login-logo">
                <h4 class="mt-3 mb-1">Admin Login</h4>
                <p class="text-muted mb-0">Access the management dashboard</p>
            </div>

            {% if messages %}
                <div class="mb-3">
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} mb-2" role="alert">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" action="{% url 'admin_panel_login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input class="form-control" type="text" name="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input class="form-control" type="password" name="password" placeholder="••••••••" required>
                </div>
                <button class="btn btn-primary btn-block admin-btn" type="submit">
                    <i class="fa fa-lock"></i> Login
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'index' %}" class="small">Back to website</a>
            </div>
        </div>
    </div>
</body>
</html>
